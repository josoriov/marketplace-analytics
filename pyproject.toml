[project]
name = "marketplace-analytics"
version = "0.1.0"
description = "Olist marketplace ingestion and seller analytics API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "polars",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "dbt>=2.0.0,<3",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
